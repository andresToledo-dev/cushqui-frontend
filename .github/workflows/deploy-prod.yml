name: Deploy production

# Producción se despliega solo cuando se fusiona (merge) un PR en main.
# Se escucha el push que el merge deja en main (y no el evento pull_request) para que el run
# y el despliegue corran en main y no en la rama del PR.
# Un push directo a main no despliega. "Run workflow" permite repetir un despliegue a mano desde main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues de producción a la vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Vercel rechaza CLIs antiguas: súbela si el despliegue se queja de la versión
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  # ¿El push a main viene de fusionar un PR? Un push directo no tiene PR asociado.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      from_pr: ${{ steps.pr.outputs.from_pr }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          echo "PRs fusionados con este commit: $count"
          echo "from_pr=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    # always() para que el job corra con workflow_dispatch, donde check se salta
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.check.outputs.from_pr == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Los secretos viven en el entorno "production" de GitHub (Settings → Environments)
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
