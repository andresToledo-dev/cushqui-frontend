name: Deploy production

# Producción se despliega solo cuando se fusiona (merge) un PR en main.
# Un push directo a main no despliega. "Run workflow" permite repetir un despliegue a mano desde main.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues de producción a la vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Vercel rechaza CLIs antiguas: súbela si el despliegue se queja de la versión
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Los secretos viven en el entorno "production" de GitHub (Settings → Environments)
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El commit que el merge dejó en main
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
